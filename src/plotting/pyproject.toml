[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "belle2-plotting"
version = "0.1.0"
description = "TOML-driven PV overview, dataset-window and crosscheck plots"
readme = "README.md"
requires-python = ">=3.11"
# Also requires the local belle2-dataset package (src/dataset); install it first:
#   pip install -e ./src/dataset -e ./src/plotting
dependencies = ["numpy>=2.0", "pandas>=2.2", "pyarrow>=18", "h5py>=3.12", "matplotlib>=3.8", "SciencePlots>=2.1"]

[tool.setuptools]
packages = ["plotting"]
package-dir = {plotting = "."}
include-package-data = false

[tool.setuptools.package-data]
plotting = ["examples/*.toml"]
