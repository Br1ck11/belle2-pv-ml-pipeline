[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "belle2-models"
version = "0.1.0"
description = "PyTorch models for Belle II PV windows, one folder per model"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["torch>=2.2"]

[tool.setuptools]
# Editable installs (pip install -e) find new model folders automatically.
# For a non-editable wheel, list each new model folder here as well.
packages = ["models", "models.cnn_vae"]
package-dir = {models = ".", "models.cnn_vae" = "cnn_vae"}
include-package-data = false

[tool.setuptools.package-data]
"models.cnn_vae" = ["exampleTrain.toml"]
